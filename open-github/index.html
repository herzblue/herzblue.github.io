<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>GitHub 앱에서 열기</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fa; color: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(420px, calc(100% - 48px)); box-sizing: border-box; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { line-height: 1.55; color: #57606a; margin: 0 0 26px; }
    button, a { display: block; box-sizing: border-box; width: 100%; border-radius: 10px; padding: 15px 18px; font-size: 17px; font-weight: 700; text-decoration: none; }
    button { border: 0; background: #24292f; color: white; cursor: pointer; }
    a { margin-top: 12px; color: #0969da; border: 1px solid #d0d7de; background: white; }
    .error { display: none; color: #cf222e; }
  </style>
</head>
<body>
  <main>
    <h1>GitHub 앱에서 열기</h1>
    <p id="description">버튼을 누르면 GitHub 앱에서 비공개 문서를 엽니다.</p>
    <button id="open" type="button">GitHub 앱에서 열기</button>
    <a id="web" href="#">브라우저에서 열기</a>
    <p id="error" class="error">열 파일 주소가 올바르지 않습니다.</p>
  </main>
  <script>
    const allowedPrefix = 'https://github.com/herzblue/hermes-data/blob/';
    const target = new URLSearchParams(location.search).get('url');
    const valid = target && target.startsWith(allowedPrefix);
    const openButton = document.getElementById('open');
    const webLink = document.getElementById('web');

    if (!valid) {
      openButton.hidden = true;
      webLink.hidden = true;
      document.getElementById('description').hidden = true;
      document.getElementById('error').style.display = 'block';
    } else {
      webLink.href = target;
      openButton.addEventListener('click', () => {
        // GitHub for iOS handles this custom URL after the user taps the button.
        location.href = 'github://openRepo/' + target;
      });
    }
  </script>
</body>
</html>
